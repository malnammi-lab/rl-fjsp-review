# The core: the questions every core study is coded on, from its full text (protocol, Data
# extraction, Part B). The decision rule of every code is in datasets/coding-scheme.md,
# Part B, which the coding agent receives; this file is its machine-readable mirror, read by
# the checker (runners/core_check.py), the person's check (runners/core_verify.py) and the
# gather (runners/core_gather.py). tests/test_core_scheme.py keeps the two in step. Written
# on 20 October 2026, before any full text was coded.
#
# [questions.<ID>], in Part B's order. Section A's questions name a Part A axis (`axis`) and
# take its codes, kind and `not-stated` rule from configs/map.toml; the others give:
#
#   name          the question's name, the column it fills in datasets/coded-studies.csv
#   section       A to F, or Q
#   rq            the research question it serves ("quality" for section Q)
#   type          code (one code), codes (a list), number, text, level, score or count
#   codes         the codes of a code, codes or level question
#   alone         on a list, codes that may not be combined with another
#   default       the code given when the paper is silent; such a question allows no
#                 `not-stated`
#   special       the special answers allowed: not-stated, not-applicable, not-reported
#   applies_when  conditions, all of which must hold for the question to apply; where they
#                 do not, the answer is `not-applicable`, and where they do, it is not. Each
#                 names a question and gives `codes` (its answer holds one of them),
#                 `min_codes` (its list holds at least that many codes) or `above` (its number
#                 is above the value). A condition on a question answered with a special
#                 answer is not decided, and constrains nothing.
#   no_quote      answers that need no evidence (special answers and `none` on a count never
#                 do)
#   words         the word limit of a text answer
#   group         a count's item blocks (see [groups])
#   label         what the question asks, in one line
#
# [groups.<name>]: the item blocks of a count (`## D07.1 baseline`): its parent question,
# the most items it may hold, the kind of the item's answer, and the fields each item gives,
# one code each. `unique`: no two items give the same answer.
#
# [[rule]]: a check between two questions, reported by the checker and never applied:
# when question `if` holds one of `if_codes`, question `then` must hold one of `then_codes`,
# or none of `then_not`. Part A's five implications (src/mapcodes.py IMPLICATIONS) are
# checked on section A as well.
#
# [derived.<name>]: a column the gather computes from an answer, never asked: `map` gives
# the value of each code of `from`; `min_codes` gives "yes" when `from` holds at least that
# many codes, else "no". A special answer is carried over unchanged.

[questions.A01]
axis = "policy_role"
section = "A"
rq = "1.1"

[questions.A02]
