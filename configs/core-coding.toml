# ------------------------------------------------------------------------- item groups

[groups.baseline]
parent = "D07"
max_items = 8
answer = "text"
words = 12
label = "a group of baselines, named as the paper prints them"

[groups.baseline.fields.kind]
codes = ["dispatching-rule", "metaheuristic", "exact-solver", "learned-policy", "other"]

[groups.baseline.fields.run]
codes = ["rerun", "copied", "not-stated"]

[groups.baseline.fields.time_limit]
codes = ["stated", "not-stated", "not-applicable"]

[groups.claim]
parent = "D19"
max_items = 6
answer = "code"
codes = ["beats-dispatching-rules", "beats-metaheuristics", "beats-exact-solver",
         "beats-learned-policies", "generalizes-across-sizes", "trains-stably"]
unique = true
label = "a recurring claim the paper makes"

[groups.transfer_test]
parent = "E01"
max_items = 6
answer = "codes"
codes = ["size", "flexibility", "layout", "processing-times", "events",
         "objective-or-constraints", "other-factory", "public-benchmark", "real-data", "other"]
label = "how a transfer test's instances differ from the training instances"

[groups.transfer_test.fields.provenance]
codes = ["generated", "public-benchmark", "industrial", "other"]

[groups.transfer_test.fields.mode]
codes = ["unchanged", "fine-tuned", "retrained", "not-stated"]

[groups.transfer_test.fields.outcome]
codes = ["holds", "degrades", "mixed", "not-stated"]

# ------------------------------------------------------------- checks between questions

[[rule]]
name = "a named benchmark set means public-benchmark instances"
if = "benchmark_sets"
if_codes = ["brandimarte", "hurink", "dauzere-peres-paulli", "kacem", "barnes", "fattahi",
            "behnke-geiger", "taillard", "lawrence", "other-benchmark"]
then = "instances"
then_codes = ["public-benchmark"]

[[rule]]
name = "REINFORCE, PPO and TRPO are policy gradient"
if = "algorithm"
if_codes = ["reinforce", "ppo", "trpo"]
then = "training_algorithm_family"
then_codes = ["policy-gradient"]

[[rule]]
name = "Monte Carlo, SARSA and Q-learning are value-based"
if = "algorithm"
if_codes = ["monte-carlo", "sarsa", "q-learning"]
then = "training_algorithm_family"
then_codes = ["value-based"]

[[rule]]
name = "A2C, A3C, DDPG, TD3 and SAC are actor-critic"
if = "algorithm"
if_codes = ["a2c-a3c", "ddpg-td3", "sac"]
then = "training_algorithm_family"
then_codes = ["actor-critic"]

[[rule]]
name = "an end-to-end policy takes a scheduling decision itself"
if = "policy_role"
if_codes = ["end-to-end"]
then = "sub_decision"
then_not = ["not-applicable"]

[[rule]]
name = "a run beyond simulation is also a claim beyond simulation"
if = "readiness_level"
if_codes = ["L2", "L3", "L4", "L5"]
then = "readiness_claim"
then_not = ["none"]

# ------------------------------------------------------------------- derived columns

# The survey's families (planning, the survey's structure): PPO and TRPO are filed under
# policy gradient although they train a critic. Monte Carlo control is taken as on-policy,
# its usual form; a paper with an off-policy form says so in its note.
[derived.algorithm_family]
from = "algorithm"

[derived.algorithm_family.map]
monte-carlo = "value-based"
sarsa = "value-based"
q-learning = "value-based"
reinforce = "policy-gradient"
ppo = "policy-gradient"
trpo = "policy-gradient"
a2c-a3c = "actor-critic"
ddpg-td3 = "actor-critic"
sac = "actor-critic"
other = "other"

[derived.policy_update]
from = "algorithm"

[derived.policy_update.map]
monte-carlo = "on-policy"
sarsa = "on-policy"
q-learning = "off-policy"
reinforce = "on-policy"
ppo = "on-policy"
trpo = "on-policy"
a2c-a3c = "on-policy"
ddpg-td3 = "off-policy"
sac = "off-policy"
other = "other"

