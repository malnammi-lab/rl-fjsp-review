# The paper's figures, and the supplement's list of the core's studies, regenerated by
# runners/make_figures.py.
#
# Every figure is computed from the tables the statistics and synthesis runners write. No count
# is written into any script. Each figure also writes a CSV of the exact values it plotted,
# beside the image, so a reader can check a bar against a number. The runner also reads
# datasets/coded-studies.csv (one row per study of the core, from runners/core_gather.py) and
# refuses a code that [codes] does not list.
#
# Run: python runners/run_all.py --only make-figures

# Multi-label columns use "|" between codes. This key must sit above the first table
# header: in TOML a bare key written after a header belongs to that table.
multi_label = ["deep_architecture"]

[inputs]
references = "datasets/references.json"   # the searched corpus
coded = "datasets/coded-studies.csv"       # written by runners/core_gather.py
out_dir = "results/figures"
table_periods = "results/core/map-by-period.csv"
table_statistics = "results/core/core-statistics.csv"
table_studies = "results/core-synthesis/studies-by-cell.csv"
table_readiness = "results/core-synthesis/rq5-readiness.csv"


# Every code a column may contain, the special answers among them. make_figures.py rejects
# a row carrying a code not listed here, so a code the scheme does not have fails loudly.
# Part B (datasets/coding-scheme.md) and its mirror configs/core-coding.toml define them.
[codes]
role = ["end-to-end", "steering", "not-stated"]
deep_architecture = ["fully-connected", "convolutional", "recurrent", "graph-neural-network",
                     "attention-transformer", "pointer-network", "other", "not-applicable",
                     "not-stated"]

# The look of every figure. Seaborn's paper context at font_scale 0.9 sets tick and legend
# text to about 7.9 pt, and labels and titles to about 8.6 pt. Every figure is drawn at the
# width it prints at (elsarticle 5p: textwidth 522 pt, columnsep 18 pt), so these are the
# printed sizes. pdf.fonttype 42 embeds TrueType fonts in the PDF.
[style]
context = "paper"
style = "ticks"
palette = "colorblind"
font = "sans-serif"
font_scale = 0.9
column_width_in = 3.49
text_width_in = 7.22
dpi = 300
grid_color = "0.88"

[style.rc]
"font.sans-serif" = ["Arial", "Liberation Sans", "DejaVu Sans"]
"pdf.fonttype" = 42
"ps.fonttype" = 42
"legend.frameon" = false
"axes.spines.top" = false
"axes.spines.right" = false

# The colors, all from [style] palette. The roles keep one color in every figure (`fixed`,
# palette positions). Every other axis gives its codes the palette in the order listed under
# [colors.axes], the grey left out, so a code keeps its color wherever its axis is drawn, and
# colors repeat only across different axes. `not-stated` is the palette's grey, and the codes
# grouped as Others are light grey. `single` colors a figure of one series.
[colors]
grey = 7
light = "#D4D4D4"
single = 0
fixed = { "end-to-end" = 0, "steering" = 3, "steering-rules" = 2, "steering-heuristic" = 1 }

[colors.axes]
training_algorithm_family = ["value-based", "policy-gradient", "actor-critic", "other"]
deep_architecture = ["fully-connected", "convolutional", "recurrent", "graph-neural-network",
                     "attention-transformer", "pointer-network", "other", "not-applicable"]

# The supplement's list of the core's studies, from the synthesis's list of studies by cell.
[core_studies]
source = "table_studies"
csv = "results/tables/core-studies.csv"
tex = "results/tables/core-studies.tex"


# Each figure: `width` is "column" or "text"; `height_in` its height in inches.

[[figure]]
name = "map-trends"
kind = "map-periods"
source = "table_periods"
year_source = "table_statistics"
file = "fig-map-by-period"
partial_year = "2026"
axes = ["policy_role", "training_algorithm_family", "deep_architecture"]
single_axes = ["policy_role"]
# The panels' relative widths: the year panel's rotated ticks need less room, and the
# role panel's stacked bars more, so its three period ticks do not run together.
width_ratios = [0.8, 1.2, 1, 1]
small_share = 2
others = { deep_architecture = ["pointer-network", "other"] }
width = "text"
height_in = 3.4
# How far below a panel's axes its legend starts: room for the two-line period ticks.
legend_offset_in = 0.42

[[figure]]
name = "readiness"
kind = "readiness"
file = "fig-readiness"
source = "table_readiness"
roles = ["end-to-end", "steering"]
levels = ["L1", "L2", "L3", "L4", "L5"]
width = "column"
height_in = 4.0
checks = [
    { label = "Deadline tested", field = "decision_deadlines", code = "tested" },
    { label = "Interpretability shown", field = "interpretability", code = "shown" },
    { label = "Imperfect data tested", field = "imperfect_data", code = "tested" },
    { label = "Disruption tested", field = "robustness", code = "tested" },
]
